name: custom
description: "Custom target-size profile - single-pass ABR + VBV for fast target adherence"
scaling: bicubic
encodes:
  - type: X264Encode
    suffix: ""
    width: null
    height: null
    twoPass: false
    params:
      b:v: "#{profileParams['bv'] ?: '2000k'}"
      maxrate: "#{profileParams['mr'] ?: '3000k'}"
      bufsize: "#{profileParams['bs'] ?: '6000k'}"
      preset: "#{profileParams['preset'] ?: 'faster'}"
      threads: "#{profileParams['threads'] ?: '6'}"
      pix_fmt: yuv420p
      movflags: "+faststart"
    audioEncode:
      type: AudioEncode
      codec: aac
      bitrate: 96k
