name: maxcomp
description: "Maximum compression, slowest (HEVC/H.265 CRF30 medium)"
scaling: bicubic
encodes:
  - type: X265Encode
    suffix: ""
    width: null
    height: null
    twoPass: false
    params:
      crf: "30"
      preset: medium
      pix_fmt: yuv420p
      movflags: "+faststart"
    audioEncode:
      type: AudioEncode
      codec: aac
      bitrate: 96k
