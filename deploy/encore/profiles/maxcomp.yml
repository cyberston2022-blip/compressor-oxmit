name: maxcomp
description: "Maximum compression - HEVC/H.265 CRF30 superfast (avoids medium cliff)"
scaling: bicubic
encodes:
  - type: X265Encode
    suffix: ""
    width: null
    height: null
    twoPass: false
    params:
      crf: "#{profileParams['crf'] ?: '30'}"
      preset: "#{profileParams['preset'] ?: 'superfast'}"
      threads: "#{profileParams['threads'] ?: '1'}"
      x265-params: "#{profileParams['x265_params'] ?: profileParams['x265-params'] ?: 'pools=3:frame-threads=1'}"
      pix_fmt: yuv420p
      movflags: "+faststart"
    audioEncode:
      type: AudioEncode
      codec: aac
      bitrate: 96k
