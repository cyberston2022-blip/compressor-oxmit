name: balanced
description: "General-purpose balance between quality, speed and size (H.264 CRF22)"
scaling: bicubic
encodes:
  - type: X264Encode
    suffix: ""
    width: null
    height: null
    twoPass: false
    params:
      crf: "22"
      preset: faster
      pix_fmt: yuv420p
      movflags: "+faststart"
    audioEncode:
      type: AudioEncode
      codec: aac
      bitrate: 128k
