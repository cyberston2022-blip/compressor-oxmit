name: edu360
description: "Educational video - 360p high-clarity Lanczos + unsharp font filter, voice audio (lowest size)"
scaling: lanczos
encodes:
  - type: X264Encode
    suffix: ""
    width: 640
    height: null
    twoPass: false
    params:
      crf: "#{profileParams['crf'] ?: '26'}"
      preset: "#{profileParams['preset'] ?: 'veryfast'}"
      threads: "#{profileParams['threads'] ?: '6'}"
      aq-mode: "3"
      rc-lookahead: "40"
      pix_fmt: yuv420p
      movflags: "+faststart"
    audioEncode:
      type: AudioEncode
      codec: aac
      bitrate: "#{profileParams['audio_bitrate'] ?: '48k'}"
