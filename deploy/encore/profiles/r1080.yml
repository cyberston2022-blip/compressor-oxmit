name: r1080
description: "Scale down to 1080p (never upscales - guarded by the bot)"
scaling: bicubic
encodes:
  - type: X264Encode
    suffix: ""
    width: 1920
    height: null
    twoPass: false
    params:
      crf: "22"
      preset: faster
      pix_fmt: yuv420p
      movflags: "+faststart"
    audioEncode:
      type: AudioEncode
      codec: aac
      bitrate: 128k
