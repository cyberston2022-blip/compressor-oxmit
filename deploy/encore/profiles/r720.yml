name: r720
description: "Scale down to 720p (never upscales - guarded by the bot)"
scaling: bicubic
encodes:
  - type: X264Encode
    suffix: ""
    width: 1280
    height: null
    twoPass: false
    params:
      crf: "23"
      preset: faster
      pix_fmt: yuv420p
      movflags: "+faststart"
    audioEncode:
      type: AudioEncode
      codec: aac
      bitrate: 128k
