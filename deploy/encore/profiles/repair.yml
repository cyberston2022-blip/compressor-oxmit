name: repair
description: "Repair variant of balanced - drops corrupted packets and resamples async audio (used automatically for damaged sources)"
scaling: bicubic
encodes:
  - type: X264Encode
    suffix: ""
    width: null
    height: null
    twoPass: false
    params:
      crf: "22"
      preset: faster
      pix_fmt: yuv420p
      movflags: "+faststart"
    audioEncode:
      type: AudioEncode
      codec: aac
      bitrate: 128k
      filters:
        - "aresample=async=1:first_pts=0"
