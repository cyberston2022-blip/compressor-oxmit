name: edu480
description: "Educational video - 480p Lanczos scaling, fast x264 veryfast, voice-optimized audio (lowest size)"
scaling: lanczos
encodes:
  - type: X264Encode
    suffix: ""
    width: 854
    height: null
    twoPass: false
    params:
      crf: "#{profileParams['crf'] ?: '25'}"
      preset: "#{profileParams['preset'] ?: 'veryfast'}"
      threads: "#{profileParams['threads'] ?: '6'}"
      aq-mode: "3"
      rc-lookahead: "40"
      pix_fmt: yuv420p
      movflags: "+faststart"
    audioEncode:
      type: AudioEncode
      codec: aac
      bitrate: "#{profileParams['audio_bitrate'] ?: '64k'}"
