name: edu480
# EDU480 v2 - the single active compression profile.
# Geometry is NOT fixed here: the bot computes the exact no-upscale scale
# filter (short side -> 480, aspect preserved, even dims) and the fps cap from
# the real ffprobe result and passes them as profileParams 'vf' / 'fpsf'.
# Encore evaluates this whole file as a SpEL template per job, so the values
# below are resolved per job. Fallbacks keep jobs submitted by an older bot
# version safe: landscape-safe no-upscale scale, no fps change.
description: "EDU480 v2 - educational 480p (short side), Lanczos, no upscale, fps cap, x264 CRF, speech audio"
scaling: lanczos
encodes:
  - type: X264Encode
    suffix: ""
    width: null
    height: null
    twoPass: false
    filters:
      - "#{profileParams['vf'] ?: 'scale=-2:''min(480,ih)'':flags=lanczos'}"
      - "#{profileParams['fpsf'] ?: 'null'}"
    params:
      crf: "#{profileParams['crf'] ?: '25'}"
      preset: "#{profileParams['preset'] ?: 'veryfast'}"
      threads: "#{profileParams['threads'] ?: '4'}"
      aq-mode: "3"
      rc-lookahead: "#{profileParams['rc_lookahead'] ?: '20'}"
      pix_fmt: yuv420p
      movflags: "+faststart"
    audioEncode:
      type: AudioEncode
      codec: aac
      bitrate: "#{profileParams['audio_bitrate'] ?: '64k'}"
