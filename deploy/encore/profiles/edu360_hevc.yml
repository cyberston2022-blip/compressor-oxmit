name: edu360_hevc
description: "Educational video HEVC - 360p high-clarity Lanczos + unsharp filter, x265 superfast, voice audio (maximum compression)"
scaling: lanczos
encodes:
  - type: X265Encode
    suffix: ""
    width: 640
    height: null
    twoPass: false
    params:
      crf: "#{profileParams['crf'] ?: '30'}"
      preset: "#{profileParams['preset'] ?: 'superfast'}"
      threads: "#{profileParams['threads'] ?: '6'}"
      pix_fmt: yuv420p
      movflags: "+faststart"
    audioEncode:
      type: AudioEncode
      codec: aac
      bitrate: "#{profileParams['audio_bitrate'] ?: '48k'}"
