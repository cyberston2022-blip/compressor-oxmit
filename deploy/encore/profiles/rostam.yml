name: rostam
description: "Rostam & Siavash Extreme Compression: 360p Lanczos + unsharp + denoise, HEVC superfast, 32k mono audio"
scaling: lanczos
encodes:
  - type: X265Encode
    suffix: ""
    width: 640
    height: null
    twoPass: false
    params:
      crf: "#{profileParams['crf'] ?: '32'}"
      preset: "#{profileParams['preset'] ?: 'superfast'}"
      threads: "#{profileParams['threads'] ?: '1'}"
      x265-params: "#{profileParams['x265_params'] ?: profileParams['x265-params'] ?: 'pools=3:frame-threads=1'}"
      aq-mode: "3"
      pix_fmt: yuv420p
      movflags: "+faststart"
    audioEncode:
      type: AudioEncode
      codec: aac
      bitrate: "#{profileParams['audio_bitrate'] ?: '32k'}"
