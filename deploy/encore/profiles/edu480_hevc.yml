name: edu480_hevc
description: "Educational video HEVC - 480p high-clarity Lanczos filter, x265 superfast, voice audio"
scaling: lanczos
encodes:
  - type: X265Encode
    suffix: ""
    width: 854
    height: null
    twoPass: false
    params:
      crf: "#{profileParams['crf'] ?: '29'}"
      preset: "#{profileParams['preset'] ?: 'superfast'}"
      threads: "#{profileParams['threads'] ?: '1'}"
      x265-params: "#{profileParams['x265_params'] ?: profileParams['x265-params'] ?: 'pools=3:frame-threads=1'}"
      pix_fmt: yuv420p
      movflags: "+faststart"
    audioEncode:
      type: AudioEncode
      codec: aac
      bitrate: "#{profileParams['audio_bitrate'] ?: '64k'}"
